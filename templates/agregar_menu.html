<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://media.istockphoto.com/id/1428737062/es/foto/mesa-de-madera-vac%C3%ADa-con-luces-bokeh-en-el-fondo-del-restaurante-borroso.jpg?s=612x612&w=0&k=20&c=sTFWhiwI909D6ivJRm32tS1Frmh0be12blfXblTq7fw=') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Arial', sans-serif;
        }
        .menu-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .menu-container h2 {
            color: #ff6f61;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .btn-custom {
            font-size: 1.1rem;
            padding: 12px 24px;
            border-radius: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            color: white;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn-warning-custom {
            background-color: #ff9a44;
        }
        .btn-warning-custom:hover {
            background-color: #e68a3c;
        }
        .btn-danger-custom {
            background-color: #ff6f61;
        }
        .btn-danger-custom:hover {
            background-color: #e65a50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu-container">
            <h2 class="text-center">Agregar Nuevo Menú</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_nombre" class="form-label">Nombre del Menú</label>
                    {{ form.nombre }}
                </div>
                <div class="mb-3">
                    <label for="id_estado" class="form-label">Estado</label>
                    {{ form.estado }}
                </div>
                <button type="submit" class="btn btn-warning-custom">Guardar Menú</button>
                <a href="{% url 'lista_menus' %}" class="btn btn-danger-custom">Cancelar</a>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
