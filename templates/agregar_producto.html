<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            font-family: 'Arial', sans-serif;
        }
        .menu-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu-container">
            <h2 class="text-center">Agregar Producto a la Categoría: {{ categoria.nombre }}</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning-custom">Guardar Producto</button>
                <a href="{% url 'gestionar_menu' categoria.menu.id %}" class="btn btn-danger-custom">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
