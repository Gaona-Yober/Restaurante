<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://media.istockphoto.com/id/1428737062/es/foto/mesa-de-madera-vac%C3%ADa-con-luces-bokeh-en-el-fondo-del-restaurante-borroso.jpg?s=612x612&w=0&k=20&c=sTFWhiwI909D6ivJRm32tS1Frmh0be12blfXblTq7fw=') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Arial', sans-serif;
        }
        .inventario-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .inventario-container h2 {
            color: #ff6f61;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .btn-custom {
            font-size: 1.1rem;
            padding: 12px 24px;
            border-radius: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            color: white;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn-danger-custom {
            background-color: #ff6f61;
        }
        .btn-danger-custom:hover {
            background-color: #e65a50;
        }
        .btn-warning-custom {
            background-color: #ff9a44;
        }
        .btn-warning-custom:hover {
            background-color: #e68a3c;
        }
        .btn-success-custom {
            background-color: #ffd700;
        }
        .btn-success-custom:hover {
            background-color: #e6c200;
        }
        .contenido-derecha {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3">
                <div class="inventario-container">
                    <h2 class="text-center">Inventario</h2>
                    <div class="d-grid gap-3">
                        <button class="btn btn-danger-custom btn-custom" onclick="mostrarListaInsumos()">
                            Ver Lista de Insumos
                        </button>

                        <button class="btn btn-warning-custom btn-custom" onclick="mostrarAgregarInsumo()">
                            Agregar Nuevo Insumo
                        </button>

                        <button class="btn btn-success-custom btn-custom" onclick="mostrarRealizarOperacion()">
                            Realizar Operación
                        </button>
                    </div>
                </div>

                <div class="inventario-container mt-4">
                    <h2 class="text-center">Facturación</h2>
                    <div class="d-grid gap-3">
                        <button class="btn btn-danger-custom btn-custom" onclick="mostrarPagoTarjeta()">
                            Pago con Tarjeta
                        </button>

                        <button class="btn btn-warning-custom btn-custom" onclick="mostrarPagoTransferencia()">
                            Pago con Transferencia
                        </button>
                    </div>
                </div>

                <div class="inventario-container mt-4">
                    <h2 class="text-center">Menús</h2>
                    <div class="d-grid gap-3">
                        <button class="btn btn-danger-custom btn-custom" onclick="mostrarListaMenus()">
                            Ver Lista de Menús
                        </button>

                        <button class="btn btn-warning-custom btn-custom" onclick="mostrarAgregarMenu()">
                            Agregar Nuevo Menú
                        </button>

                        <button class="btn btn-success-custom btn-custom" onclick="mostrarGestionarCategoriasProductos()">
            Gestionar Categorías y Productos
        </button>

                       
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="contenido-derecha" id="contenido-derecha">
                    <h3 class="text-center">Bienvenido al Sistema de Gestión</h3>
                    <p class="text-center">Selecciona una opción del menú para comenzar.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function mostrarListaInsumos() {
            document.getElementById('contenido-derecha').innerHTML = `
                <h3>Ver Lista de Insumos</h3>
                <p>Aquí puedes ver la lista completa de insumos disponibles en el sistema. Revisa los detalles de cada insumo, como la cantidad disponible, la unidad de medida y el nivel de reorden.</p>
                <a href="{% url 'lista_insumos' %}" class="btn btn-danger-custom">Ir a la Lista de Insumos</a>
            `;
        }

        function mostrarAgregarInsumo() {
            document.getElementById('contenido-derecha').innerHTML = `
                <h3>Agregar Nuevo Insumo</h3>
                <p>Agrega un nuevo insumo al inventario del restaurante. Completa los detalles como nombre, cantidad, unidad de medida y más.</p>
                <a href="{% url 'agregar_insumo' %}" class="btn btn-warning-custom">Agregar Insumo</a>
            `;
        }

        function mostrarRealizarOperacion() {
            document.getElementById('contenido-derecha').innerHTML = `
                <h3>Realizar Operación de Inventario</h3>
                <p>Realiza operaciones de entrada o salida de inventario. Registra movimientos y mantén actualizado el stock.</p>
                <a href="{% url 'realizar_operacion' %}" class="btn btn-success-custom">Realizar Operación</a>
            `;
        }

        function mostrarPagoTarjeta() {
            document.getElementById('contenido-derecha').innerHTML = `
                <h3>Pago con Tarjeta</h3>
                <form>
                    <div class="mb-3">
                        <label for="numeroTarjeta" class="form-label">Número de Tarjeta</label>
                        <input type="text" class="form-control" id="numeroTarjeta" placeholder="1234 5678 9012 3456">
                    </div>
                    <div class="mb-3">
                        <label for="titularTarjeta" class="form-label">Titular de la Tarjeta</label>
                        <input type="text" class="form-control" id="titularTarjeta" placeholder="Nombre del Titular">
                    </div>
                    <div class="mb-3">
                        <label for="vencimientoTarjeta" class="form-label">Fecha de Vencimiento</label>
                        <input type="text" class="form-control" id="vencimientoTarjeta" placeholder="MM/AA">
                    </div>
                    <div class="mb-3">
                        <label for="cvvTarjeta" class="form-label">CVV</label>
                        <input type="text" class="form-control" id="cvvTarjeta" placeholder="123">
                    </div>
                    <button type="submit" class="btn btn-danger-custom">Procesar Pago</button>
                </form>
            `;
        }

        function mostrarPagoTransferencia() {
            document.getElementById('contenido-derecha').innerHTML = `
                <h3>Pago con Transferencia</h3>
                <form>
                    <div class="mb-3">
                        <label for="bancoOrigen" class="form-label">Banco de Origen</label>
                        <input type="text" class="form-control" id="bancoOrigen" placeholder="Nombre del Banco">
                    </div>
                    <div class="mb-3">
                        <label for="numeroTransferencia" class="form-label">Número de Transferencia</label>
                        <input type="text" class="form-control" id="numeroTransferencia" placeholder="Número de Referencia">
                    </div>
                    <div class="mb-3">
                        <label for="montoTransferencia" class="form-label">Monto</label>
                        <input type="number" class="form-control" id="montoTransferencia" placeholder="Monto a Transferir">
                    </div>
                    <button type="submit" class="btn btn-warning-custom">Procesar Transferencia</button>
                </form>
            `;
        }

        function mostrarGestionarMenu(menu_id) {
    fetch(`/gestionar_menu/${menu_id}/`)  // Hace una solicitud a la vista de gestión de menú
        .then(response => response.text())  // Convierte la respuesta a texto (HTML)
        .then(html => {
            document.getElementById('contenido-derecha').innerHTML = html;  // Muestra el contenido en la sección derecha
        })
        .catch(error => console.error('Error:', error));
}
        function mostrarListaMenus() {
    fetch("{% url 'lista_menus' %}")  // Hace una solicitud a la vista de lista de menús
        .then(response => response.text())  // Convierte la respuesta a texto (HTML)
        .then(html => {
            document.getElementById('contenido-derecha').innerHTML = html;  // Muestra la lista de menús
            // Agrega un evento de clic a cada menú para mostrar sus categorías y productos
            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', () => {
                    const menuId = item.dataset.menuId;
                    mostrarGestionarMenu(menuId);
                });
            });
        })
        .catch(error => console.error('Error:', error));
}



        function mostrarGestionarCategoriasProductos() {
    document.getElementById('contenido-derecha').innerHTML = `
        <h3>Gestionar Categorías y Productos</h3>
        <p>Selecciona un menú para gestionar sus categorías y productos.</p>
        <div id="lista-menus-gestion"></div>
    `;

    // Cargar la lista de menús para gestionar
    fetch("{% url 'lista_menus' %}")
        .then(response => response.text())
        .then(html => {
            document.getElementById('lista-menus-gestion').innerHTML = html;
            // Agregar evento de clic a cada menú
            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', () => {
                    const menuId = item.dataset.menuId;
                    mostrarCategoriasProductos(menuId);
                });
            });
        })
        .catch(error => console.error('Error:', error));
}

function mostrarCategoriasProductos(menu_id) {
    fetch(`/gestionar_menu/${menu_id}/`)
        .then(response => response.text())
        .then(html => {
            document.getElementById('contenido-derecha').innerHTML = html;
        })
        .catch(error => console.error('Error:', error));
}

        
    </script>
</body>
</html>
