<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Operación</title>
</head>
<body>
    <h1>Realizar Operación</h1>
    <form method="post">
        {% csrf_token %}
        <label for="tipo">Tipo de Operación:</label>
        <select id="tipo" name="tipo" required>
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
        </select><br>

        <label for="insumo">Insumo:</label>
        <select id="insumo" name="insumo" required>
            {% for insumo in insumos %}
                <option value="{{ insumo.id }}">{{ insumo.nombre }}</option>
            {% endfor %}
        </select><br>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" required><br>

        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" name="observaciones"></textarea><br>

        <button type="submit">Realizar Operación</button>
    </form>
</body>
</html>
