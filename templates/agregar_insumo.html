<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Insumo</title>
</head>
<body>
    <h1>Agregar Insumo</h1>
    <form method="post">
        {% csrf_token %}
        <label for="identificador">Identificador:</label>
        <input type="text" id="identificador" name="identificador" required><br>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br>

        <label for="cantidadDisponible">Cantidad Disponible:</label>
        <input type="number" id="cantidadDisponible" name="cantidadDisponible" required><br>

        <label for="unidadMedida">Unidad de Medida:</label>
        <input type="text" id="unidadMedida" name="unidadMedida" required><br>

        <label for="nivelReorden">Nivel de Reorden:</label>
        <input type="number" id="nivelReorden" name="nivelReorden" required><br>

        <label for="precioUnitario">Precio Unitario:</label>
        <input type="number" step="0.01" id="precioUnitario" name="precioUnitario" required><br>

        <label for="ubicacion">Ubicación:</label>
        <input type="text" id="ubicacion" name="ubicacion" required><br>

        <button type="submit">Agregar</button>
    </form>
</body>
</html>
